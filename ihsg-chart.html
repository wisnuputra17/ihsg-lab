<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHSG Chart</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lightweight-charts/4.1.3/lightweight-charts.standalone.production.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#0a0e17; --bg1:#0e1420; --bg2:#131b2a; --bg3:#1a2435;
    --border:#1e2940; --border2:#2a3850;
    --text:#d8e2f0; --sub:#7891b5; --muted:#46597a;
    --green:#26a69a; --red:#ef5350; --blue:#00d4ff; --amber:#ffb800;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg0);color:var(--text);font-family:'Rajdhani',sans-serif;overflow:hidden}
  .app{display:flex;flex-direction:column;height:100vh}

  /* Toolbar */
  .toolbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bg1);
    border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tb-group{display:flex;align-items:center;gap:4px}
  .tb-label{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:1px}
  .sym-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;padding:6px 12px;
    border-radius:4px;width:110px;outline:none;text-transform:uppercase}
  .sym-input:focus{border-color:var(--blue)}
  .tf-btn{background:var(--bg2);border:1px solid var(--border);color:var(--sub);
    font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;padding:6px 10px;
    border-radius:4px;cursor:pointer;transition:all .15s}
  .tf-btn:hover{border-color:var(--border2);color:var(--text)}
  .tf-btn.active{background:rgba(0,212,255,.12);border-color:var(--blue);color:var(--blue)}
  .btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);
    font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;padding:6px 14px;
    border-radius:4px;cursor:pointer;transition:all .15s}
  .btn:hover{border-color:var(--blue)}
  .btn-blue{background:rgba(0,212,255,.12);border-color:var(--blue);color:var(--blue)}
  .tb-spacer{flex:1}
  .token-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 10px;border-radius:4px;
    width:160px;outline:none}

  /* Price header */
  .price-header{display:flex;align-items:baseline;gap:14px;padding:10px 16px;background:var(--bg1);
    border-bottom:1px solid var(--border)}
  .ph-sym{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:var(--text)}
  .ph-price{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace}
  .ph-change{font-size:14px;font-weight:600;font-family:'JetBrains Mono',monospace}
  .ph-ohlc{display:flex;gap:14px;font-size:11px;color:var(--sub);font-family:'JetBrains Mono',monospace;margin-left:auto}
  .ph-ohlc b{color:var(--text)}

  /* Chart area */
  .chart-wrap{flex:1;position:relative;background:var(--bg0)}
  #chart{width:100%;height:100%}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(10,14,23,.8);z-index:10;font-family:'JetBrains Mono',monospace;
    color:var(--blue);font-size:13px;letter-spacing:1px}
  .loading.hidden{display:none}
  .spinner{width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--blue);
    border-radius:50%;animation:spin .8s linear infinite;margin-right:10px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .status-bar{padding:5px 16px;background:var(--bg1);border-top:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);
    display:flex;justify-content:space-between}
  .err{color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="tb-group">
      <input id="sym" class="sym-input" value="BBCA" onkeydown="if(event.key==='Enter')_load()">
      <button class="btn btn-blue" onclick="_load()">GO</button>
    </div>
    <div class="tb-group" id="tf-group">
      <span class="tb-label">TF</span>
      <button class="tf-btn" data-tf="5">5m</button>
      <button class="tf-btn" data-tf="15">15m</button>
      <button class="tf-btn" data-tf="30">30m</button>
      <button class="tf-btn active" data-tf="60">1H</button>
      <button class="tf-btn" data-tf="D">1D</button>
    </div>
    <div class="tb-spacer"></div>
    <div class="tb-group">
      <span class="tb-label">TOKEN</span>
      <input id="token" type="password" class="token-input" placeholder="Bearer..." oninput="_saveToken()">
    </div>
  </div>

  <div class="price-header" id="price-header" style="display:none">
    <span class="ph-sym" id="ph-sym">—</span>
    <span class="ph-price" id="ph-price">—</span>
    <span class="ph-change" id="ph-change">—</span>
    <div class="ph-ohlc" id="ph-ohlc"></div>
  </div>

  <div class="chart-wrap">
    <div class="loading hidden" id="loading"><span class="spinner"></span>MEMUAT DATA...</div>
    <div id="chart"></div>
  </div>

  <div class="status-bar">
    <span id="status">Siap. Masukkan token lalu klik GO.</span>
    <span id="status-right">IHSG Chart v1.0 · Tahap 1</span>
  </div>
</div>

<script>
/* ═══════════ STATE ═══════════ */
var STATE = { sym:'BBCA', tf:'60', raw:[], candles:[], volumes:[] };
var chart, candleSeries, volumeSeries;

/* ═══════════ TOKEN ═══════════ */
function _getToken(){ return (document.getElementById('token').value||'').trim().replace(/[^\x00-\x7F]/g,''); }
function _saveToken(){ try{ localStorage.setItem('ihsgchart_token', _getToken()); }catch(e){} }
function _loadToken(){ try{ var t=localStorage.getItem('ihsgchart_token'); if(t) document.getElementById('token').value=t; }catch(e){} }

/* ═══════════ CHART INIT ═══════════ */
function _initChart(){
  var el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    layout:{ background:{type:'solid',color:'#0a0e17'}, textColor:'#7891b5', fontFamily:"'JetBrains Mono', monospace" },
    grid:{ vertLines:{color:'rgba(30,41,64,0.5)'}, horzLines:{color:'rgba(30,41,64,0.5)'} },
    crosshair:{ mode:LightweightCharts.CrosshairMode.Normal,
      vertLine:{color:'#46597a',width:1,style:3,labelBackgroundColor:'#1a2435'},
      horzLine:{color:'#46597a',width:1,style:3,labelBackgroundColor:'#1a2435'} },
    rightPriceScale:{ borderColor:'#1e2940', scaleMargins:{top:0.08,bottom:0.28} },
    timeScale:{ borderColor:'#1e2940', timeVisible:true, secondsVisible:false, rightOffset:6 },
    watermark:{ visible:true, text:'IHSG SUITE', fontSize:48, color:'rgba(0,212,255,0.04)',
      horzAlign:'center', vertAlign:'center' }
  });

  candleSeries = chart.addCandlestickSeries({
    upColor:'#26a69a', downColor:'#ef5350', borderUpColor:'#26a69a', borderDownColor:'#ef5350',
    wickUpColor:'#26a69a', wickDownColor:'#ef5350'
  });

  volumeSeries = chart.addHistogramSeries({
    priceFormat:{type:'volume'}, priceScaleId:'vol',
  });
  chart.priceScale('vol').applyOptions({ scaleMargins:{top:0.78,bottom:0} });

  /* Crosshair → update OHLC header */
  chart.subscribeCrosshairMove(function(param){
    if(!param.time || !param.seriesData) return;
    var c = param.seriesData.get(candleSeries);
    if(c) _updateOHLC(c);
  });

  new ResizeObserver(function(){ chart.applyOptions({width:el.clientWidth,height:el.clientHeight}); })
    .observe(el);
}

/* ═══════════ FETCH ═══════════ */
async function _load(){
  var token = _getToken();
  if(!token){ _status('Masukkan token dulu','err'); return; }
  var sym = (document.getElementById('sym').value||'').trim().toUpperCase();
  if(!sym){ _status('Masukkan kode saham','err'); return; }
  STATE.sym = sym;

  _showLoading(true);
  _status('Fetch '+sym+'...');

  try {
    var mult = STATE.tf==='D' ? 1440 : parseInt(STATE.tf);
    var now = Math.floor(Date.now()/1000);
    var span = STATE.tf==='D' ? 730*86400 : (parseInt(STATE.tf)<=15 ? 30*86400 : 180*86400);
    var from = now - span;

    var url = 'https://exodus.stockbit.com/chartbit/'+sym+'/price/intraday'+
      '?from='+now+'&to='+from+'&limit=0&minutes_multiplier='+(STATE.tf==='D'?60:mult);
    var resp = await fetch(url, { headers:{'Authorization':'Bearer '+token} });
    if(resp.status===401){ _status('Token expired/invalid','err'); _showLoading(false); return; }
    if(!resp.ok){ _status('HTTP '+resp.status,'err'); _showLoading(false); return; }

    var json = await resp.json();
    var arr = (json.data && json.data.chartbit) || [];
    if(!arr.length){ _status('Tidak ada data untuk '+sym,'err'); _showLoading(false); return; }

    STATE.raw = arr;
    _processData();
    _status('Loaded '+STATE.candles.length+' candle · '+sym);
  } catch(e){
    _status('Error: '+e.message,'err');
  }
  _showLoading(false);
}

function _processData(){
  /* Sort ascending by timestamp */
  var sorted = STATE.raw.slice().sort(function(a,b){
    return parseInt(a.unix_timestamp)-parseInt(b.unix_timestamp);
  });

  /* Aggregate to daily kalau TF = D */
  if(STATE.tf==='D'){
    sorted = _aggregateDaily(sorted);
  }

  var candles=[], volumes=[];
  var seen = {};
  sorted.forEach(function(c){
    var t = parseInt(c.unix_timestamp);
    if(seen[t]) return; seen[t]=1;
    var o=+c.open,h=+c.high,l=+c.low,cl=+c.close,v=+c.volume;
    if(!o||!cl) return;
    candles.push({ time:t, open:o, high:h, low:l, close:cl });
    volumes.push({ time:t, value:v, color: cl>=o ? 'rgba(38,166,154,0.4)' : 'rgba(239,83,80,0.4)' });
  });

  STATE.candles = candles;
  STATE.volumes = volumes;
  candleSeries.setData(candles);
  volumeSeries.setData(volumes);
  chart.timeScale().fitContent();

  /* Update price header */
  if(candles.length){
    var last = candles[candles.length-1];
    var prev = candles.length>1 ? candles[candles.length-2] : last;
    _updatePriceHeader(last, prev);
    _updateOHLC(last);
  }
}

function _aggregateDaily(hourly){
  var byDay = {};
  hourly.forEach(function(c){
    var day = c.datetime.slice(0,10);
    if(!byDay[day]){
      byDay[day] = { open:+c.open, high:+c.high, low:+c.low, close:+c.close,
        volume:+c.volume, foreign_buy:+c.foreign_buy, foreign_sell:+c.foreign_sell,
        unix_timestamp: Math.floor(new Date(day+'T00:00:00').getTime()/1000),
        datetime: day+' 00:00:00', symbol:c.symbol };
    } else {
      var d = byDay[day];
      d.high = Math.max(d.high, +c.high);
      d.low  = Math.min(d.low, +c.low);
      d.close = +c.close; /* last */
      d.volume += +c.volume;
      d.foreign_buy += +c.foreign_buy;
      d.foreign_sell += +c.foreign_sell;
    }
  });
  return Object.values(byDay).sort(function(a,b){return a.unix_timestamp-b.unix_timestamp;});
}

/* ═══════════ UI UPDATES ═══════════ */
function _updatePriceHeader(last, prev){
  document.getElementById('price-header').style.display='flex';
  document.getElementById('ph-sym').textContent = STATE.sym;
  var chg = last.close - prev.close;
  var chgPct = prev.close ? chg/prev.close*100 : 0;
  var col = chg>=0 ? 'var(--green)' : 'var(--red)';
  var priceEl = document.getElementById('ph-price');
  priceEl.textContent = last.close.toLocaleString('id-ID');
  priceEl.style.color = col;
  var chgEl = document.getElementById('ph-change');
  chgEl.textContent = (chg>=0?'+':'')+chg.toFixed(0)+' ('+(chg>=0?'+':'')+chgPct.toFixed(2)+'%)';
  chgEl.style.color = col;
}

function _updateOHLC(c){
  var col = c.close>=c.open ? 'var(--green)' : 'var(--red)';
  document.getElementById('ph-ohlc').innerHTML =
    'O <b style="color:'+col+'">'+(+c.open).toLocaleString('id-ID')+'</b> '+
    'H <b style="color:'+col+'">'+(+c.high).toLocaleString('id-ID')+'</b> '+
    'L <b style="color:'+col+'">'+(+c.low).toLocaleString('id-ID')+'</b> '+
    'C <b style="color:'+col+'">'+(+c.close).toLocaleString('id-ID')+'</b>';
}

function _showLoading(show){ document.getElementById('loading').classList.toggle('hidden', !show); }
function _status(msg, type){
  var el = document.getElementById('status');
  el.textContent = msg;
  el.className = type==='err' ? 'err' : '';
}

/* ═══════════ TIMEFRAME ═══════════ */
document.getElementById('tf-group').addEventListener('click', function(e){
  if(!e.target.classList.contains('tf-btn')) return;
  document.querySelectorAll('.tf-btn').forEach(function(b){b.classList.remove('active');});
  e.target.classList.add('active');
  STATE.tf = e.target.dataset.tf;
  _load();
});

/* ═══════════ INIT ═══════════ */
window.addEventListener('DOMContentLoaded', function(){
  _loadToken();
  _initChart();
  _status('Siap. Masukkan token lalu klik GO.');
});
</script>
</body>
</html>
