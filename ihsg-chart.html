<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHSG Chart</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e11; --panel:#1c1f26; --panel2:#262931; --hover:#2a2e39;
    --border:#1c1f26; --border2:#363a45;
    --text:#d1d4dc; --sub:#868993; --muted:#5d606b;
    --green:#26a69a; --red:#f23645; --blue:#2962ff; --blue2:#5b9cf6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    overflow:hidden;font-size:13px;-webkit-font-smoothing:antialiased}
  .tv{display:flex;flex-direction:column;height:100vh}

  /* TOP TOOLBAR */
  .topbar{display:flex;align-items:center;height:44px;background:var(--bg);
    border-bottom:1px solid var(--border2);padding:0 6px;gap:2px;flex-shrink:0}
  .tb-search{display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;
    background:transparent;border:none;color:var(--text);font-family:inherit;font-size:14px;
    font-weight:600;border-radius:5px;cursor:pointer;transition:background .12s}
  .tb-search:hover{background:var(--hover)}
  .tb-search .ico{font-size:15px;color:var(--sub)}
  .tb-icon{width:34px;height:32px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:5px;
    font-size:15px;transition:background .12s}
  .tb-icon:hover{background:var(--hover)}
  .tb-tf{min-width:32px;height:32px;padding:0 9px;background:transparent;border:none;
    color:var(--text);font-family:inherit;font-size:13px;font-weight:600;
    border-radius:5px;cursor:pointer;transition:all .12s}
  .tb-tf:hover{background:var(--hover)}
  .tb-tf.active{background:var(--panel2);color:var(--blue2)}
  .tb-text{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;background:transparent;
    border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:500;
    border-radius:5px;cursor:pointer;transition:background .12s}
  .tb-text:hover{background:var(--hover)}
  .tb-sep{width:1px;height:20px;background:var(--border2);margin:0 5px}
  .tb-spacer{flex:1}
  .token-inp{background:var(--panel);border:1px solid var(--border2);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 9px;border-radius:5px;
    width:140px;outline:none}
  .token-inp:focus{border-color:var(--blue)}
  .btn-acct{height:32px;padding:0 16px;background:transparent;border:1px solid var(--green);
    color:var(--green);font-family:inherit;font-size:13px;font-weight:600;border-radius:6px;
    cursor:pointer;white-space:nowrap}

  /* search dropdown */
  .sym-dd{position:absolute;top:44px;left:8px;background:var(--panel);border:1px solid var(--border2);
    border-radius:8px;width:240px;max-height:320px;overflow-y:auto;z-index:100;display:none;
    box-shadow:0 12px 32px rgba(0,0,0,.6);padding:6px}
  .sym-dd.show{display:block}
  .sym-dd input{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);
    padding:8px 10px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:12px;
    outline:none;margin-bottom:6px}
  .sym-dd-item{padding:8px 10px;cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;
    border-radius:4px;display:flex;justify-content:space-between}
  .sym-dd-item:hover{background:var(--hover)}
  .sym-dd-item .ex{color:var(--muted);font-size:10px}

  /* timeframe dropdown */
  .tf-dd{position:absolute;top:44px;background:var(--panel);border:1px solid var(--border2);
    border-radius:8px;width:120px;z-index:100;display:none;box-shadow:0 12px 32px rgba(0,0,0,.6);padding:6px}
  .tf-dd.show{display:block}
  .tf-dd-item{padding:8px 12px;cursor:pointer;font-size:13px;border-radius:4px}
  .tf-dd-item:hover{background:var(--hover)}
  .tf-dd-item.active{color:var(--blue2)}

  /* MAIN */
  .main{flex:1;display:flex;min-height:0}
  .left-tools{width:48px;background:var(--bg);border-right:1px solid var(--border2);
    display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:1px;flex-shrink:0}
  .tool{width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--sub);cursor:pointer;border-radius:6px;
    font-size:17px;transition:all .12s}
  .tool:hover{background:var(--hover);color:var(--text)}
  .tool.active{color:var(--blue2)}
  .tool-sep{width:24px;height:1px;background:var(--border2);margin:4px 0}

  .chart-col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  /* header info inline */
  .chart-head{position:absolute;top:10px;left:14px;z-index:5;display:flex;align-items:center;
    gap:8px;font-size:13px;pointer-events:none}
  .ch-name{font-weight:600;color:var(--text)}
  .ch-meta{color:var(--sub);font-size:12px}
  .ch-ohlc{display:flex;gap:9px;font-size:12px;font-weight:500;margin-left:4px}
  .ch-ohlc .lbl{color:var(--sub);margin-right:2px}
  #chart{flex:1;min-height:0}

  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(13,14,17,.85);z-index:20;flex-direction:column;gap:14px}
  .loading.hidden{display:none}
  .spinner{width:30px;height:30px;border:3px solid var(--border2);border-top-color:var(--blue2);
    border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .load-txt{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--sub)}
  .err-banner{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:var(--panel);border:1px solid var(--red);border-radius:10px;padding:22px 30px;
    z-index:30;text-align:center;display:none;max-width:420px}
  .err-banner.show{display:block}
  .err-banner h3{color:var(--red);margin-bottom:10px;font-size:16px}
  .err-banner p{color:var(--sub);font-size:13px;line-height:1.6}

  /* tv watermark */
  .active-ind-bar{position:absolute;top:34px;left:14px;z-index:5;display:flex;flex-wrap:wrap;gap:6px}
  .active-ind-chip{display:flex;align-items:center;gap:7px;background:rgba(28,31,38,0.9);
    border:1px solid var(--border2);border-radius:5px;padding:3px 8px;font-size:11px;
    color:var(--text);backdrop-filter:blur(4px)}
  .aic-x{cursor:pointer;color:var(--sub);font-size:14px;line-height:1}
  .aic-x:hover{color:var(--red)}
  .aic-set{cursor:pointer;color:var(--sub);font-size:11px;line-height:1}
  .aic-set:hover{color:var(--blue2)}
  .tv-mark{position:absolute;bottom:38px;left:14px;z-index:5;width:30px;height:30px;
    border-radius:6px;background:var(--blue);display:flex;align-items:center;justify-content:center;
    font-weight:800;color:#fff;font-size:13px;opacity:.85;pointer-events:none}

  .statusbar{height:26px;background:var(--bg);border-top:1px solid var(--border2);
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);flex-shrink:0}

  /* indicators modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;
    align-items:center;justify-content:center}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border2);border-radius:10px;
    width:480px;max-height:70vh;display:flex;flex-direction:column;overflow:hidden}
  .modal-head{padding:14px 18px;border-bottom:1px solid var(--border2);display:flex;
    justify-content:space-between;align-items:center}
  .modal-head h3{font-size:15px;font-weight:600}
  .modal-close{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .modal-body{padding:8px;overflow-y:auto}
  .ind-item{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;
    cursor:pointer;border-radius:6px}
  .ind-item:hover{background:var(--hover)}
  .ind-name{font-size:13px}
  .ind-cat{font-size:10px;color:var(--muted)}
  .ind-add{color:var(--blue2);font-size:11px;opacity:0}
  .ind-item:hover .ind-add{opacity:1}
  .bm-row{padding:5px 6px;border-radius:4px;cursor:pointer;font-size:12px;line-height:1.6}
  .bm-row:hover{background:var(--hover,#2a2e39)}
  .bm-chip{padding:4px 9px;background:#1c1f26;border:1px solid #363a45;border-radius:4px;
    font-size:11px;color:#d1d4dc;cursor:pointer}
  .bm-chip:hover{background:#2962ff;border-color:#2962ff;color:#fff}
  .bm-chip-on{background:#2962ff;border-color:#2962ff;color:#fff}
  .bm-fetch-btn{padding:8px 14px;background:#2962ff;border:none;border-radius:5px;color:#fff;
    font-size:12px;cursor:pointer;font-weight:500}
  .bm-fetch-btn:hover{background:#1e53e0}
  .bgfetch-bar{position:fixed;top:0;left:0;right:0;height:0;z-index:9999;background:rgba(13,14,17,.95);
    overflow:hidden;transition:height .2s;display:flex;align-items:center}
  .bgfetch-bar.on{height:24px;border-bottom:1px solid #363a45}
  .bgfetch-fill{position:absolute;top:0;left:0;height:100%;background:linear-gradient(90deg,#2962ff,#26a69a);
    width:0;transition:width .3s;opacity:.25}
  .bgfetch-label{position:relative;z-index:1;font-size:11px;color:#d1d4dc;padding:0 12px;
    white-space:nowrap;font-family:'JetBrains Mono',monospace}</style>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<div id="bgfetch-bar" class="bgfetch-bar">
  <div id="bgfetch-fill" class="bgfetch-fill"></div>
  <div id="bgfetch-label" class="bgfetch-label"></div>
</div>
<div class="tv">
  <div class="topbar">
    <button class="tb-search" onclick="_toggleSymDD()"><span class="ico">🔍</span><span id="cur-sym">IHSG</span></button>
    <div class="sym-dd" id="sym-dd">
      <input id="sym-search-inp" placeholder="Cari saham..." oninput="_filterSyms(this.value)" onkeydown="if(event.key==='Enter')_pickFirst()">
      <div id="sym-list"></div>
    </div>
    <button class="tb-icon" onclick="_toggleSymDD()" title="Tambah">＋</button>
    <div class="tb-sep"></div>
    <button class="tb-text" onclick="_toggleTFDD()" id="tf-label">D ▾</button>
    <div class="tf-dd" id="tf-dd">
      <div class="tf-dd-item" data-tf="5">5 menit</div>
      <div class="tf-dd-item" data-tf="15">15 menit</div>
      <div class="tf-dd-item" data-tf="30">30 menit</div>
      <div class="tf-dd-item" data-tf="60">1 jam</div>
      <div class="tf-dd-item active" data-tf="D">1 hari</div>
      <div class="tf-dd-item" data-tf="W">1 minggu</div>
    </div>
    <div class="tb-sep"></div>
    <button class="tb-icon" title="Candle">📊</button>
    <button class="tb-icon" title="Indikator fx" onclick="_openIndicators()">ƒ</button>
    <button class="tb-text" onclick="_openIndicators()">Indicators</button>
    <button class="tb-icon" title="Layout">▦</button>
    <button class="tb-icon" title="Drawing">🖌</button>
    <div class="tb-sep"></div>
    <button class="tb-icon" title="Undo">↶</button>
    <button class="tb-icon" title="Redo">↷</button>
    <div class="tb-spacer"></div>
    <button class="tb-icon" onclick="_zoomOut()" title="Zoom Out">−</button>
    <button class="tb-icon" onclick="_zoomIn()" title="Zoom In">+</button>
    <button class="tb-icon" onclick="_fitChart()" title="Fit">⊡</button>
    <input id="token" type="password" class="token-inp" placeholder="Bearer token..." oninput="_saveToken()">
    <button class="tb-icon" onclick="_load()" title="Reload">↻</button>
    <button class="tb-icon" title="Settings">⚙</button>
    <button class="tb-icon" title="Fullscreen" onclick="_fullscreen()">⛶</button>
    <button class="tb-icon" title="Screenshot">📷</button>
  </div>

  <div class="main">
    <div class="left-tools">
      <button class="tool active" title="Cursor">⊹</button>
      <button class="tool" title="Trend Line">╱</button>
      <button class="tool" title="Horizontal Line">☰</button>
      <button class="tool" title="Fibonacci">⩘</button>
      <div class="tool-sep"></div>
      <button class="tool" title="Brush">🖌</button>
      <button class="tool" title="Text">𝐓</button>
      <button class="tool" title="Emoji">☺</button>
      <div class="tool-sep"></div>
      <button class="tool" title="Ruler">📐</button>
      <button class="tool" title="Zoom">🔍</button>
      <button class="tool" title="Magnet">🧲</button>
      <button class="tool" title="Pencil Lock">✎</button>
      <button class="tool" title="Lock">🔒</button>
      <button class="tool" title="Hide">👁</button>
      <div class="tool-sep"></div>
      <button class="tool" title="Trash">🗑</button>
    </div>

    <div class="chart-col">
      <div class="chart-head" id="chart-head">
        <span class="ch-name" id="ch-name">—</span>
        <span class="ch-meta" id="ch-meta"></span>
        <div class="ch-ohlc" id="ch-ohlc"></div>
      </div>
      <div class="active-ind-bar" id="active-ind"></div>
      <div id="chart"></div>
      <div class="tv-mark">📈</div>
      <div class="loading" id="loading"><div class="spinner"></div><div class="load-txt">Memuat library...</div></div>
      <div class="err-banner" id="err-banner"><h3>⚠ Error</h3><p id="err-msg"></p></div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status">Memuat...</span>
    <span>IHSG SUITE · Chart</span>
  </div>
</div>

<!-- Indicators Modal -->
<div class="modal-bg" id="ind-modal" onclick="if(event.target===this)_closeIndicators()">
  <div class="modal">
    <div class="modal-head"><h3>Indikator &amp; Strategi</h3><button class="modal-close" onclick="_closeIndicators()">×</button></div>
    <div class="modal-body" id="ind-list"></div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-bg" id="set-modal" onclick="if(event.target===this)_closeSettings()">
  <div class="modal" style="width:320px">
    <div class="modal-head"><h3 id="set-title">Pengaturan</h3><button class="modal-close" onclick="_closeSettings()">×</button></div>
    <div class="modal-body" id="set-body" style="padding:18px"></div>
  </div>
</div>

var EMITEN_DB={}; /* code → {name, sector, sub_sector} */

function _loadEmitenDB(){
  /* Cek localStorage dulu (cache 7 hari) */
  try{
    var ls=localStorage.getItem('emiten_db');
    if(ls){
      var parsed=JSON.parse(ls);
      var age=(Date.now()-(parsed.ts||0))/(1000*60*60*24);
      if(age<7&&parsed.data&&Object.keys(parsed.data).length){
        EMITEN_DB=parsed.data;
        _applyEmitenDB();
        return;
      }
    }
  }catch(e){}
  /* Fetch dari GitHub */
  var owner=_getGHOwner(), repo=_getGHRepo();
  if(!owner||!repo)return;
  fetch('https://raw.githubusercontent.com/'+owner+'/'+repo+'/main/emiten.json')
    .then(function(r){ if(!r.ok)throw new Error('not found'); return r.json(); })
    .then(function(d){
      var arr=d.emiten||d.stocks||d||[];
      if(Array.isArray(arr)){
        arr.forEach(function(e){ if(e.code)EMITEN_DB[e.code]={name:e.name||'',sector:e.sector||'',sub_sector:e.sub_sector||''}; });
      }
      try{ localStorage.setItem('emiten_db',JSON.stringify({data:EMITEN_DB,ts:Date.now()})); }catch(e){}
      _applyEmitenDB();
    })
    .catch(function(){}); /* silent fail — chart tetap jalan tanpa DB */
}

async function _load(){
  var token=_getToken();
  if(!token){_err('Masukkan Bearer token di kanan atas, lalu klik ↻');_loadingTxt(false);return;}
  _hideErr();
  var sym=STATE.sym;
  _loadingTxt(true,'Memuat '+sym+'...');
  try{
    var isDW=(STATE.tf==='D'||STATE.tf==='W');

    /* ══ Daily & Weekly: endpoint /price/daily (format tanggal, sudah split-adjusted,
          satu request bisa 20+ tahun, mencakup 2020-2021 yang tidak ada di intraday) ══ */
    if(isDW){
      var fmt=function(ts){var d=new Date(ts*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
      var nowSec=Math.floor(Date.now()/1000);
      var toDate=fmt(nowSec+86400);              /* from = tanggal terbaru (+1 hari buffer) */
      var fromDate=fmt(Math.floor(new Date('2005-01-01').getTime()/1000)); /* to = tanggal terlama */
      var urlD='https://exodus.stockbit.com/chartbit/'+sym+'/price/daily?from='+toDate+'&to='+fromDate+'&limit=0';
      var respD;
      try{ respD=await fetch(urlD,{headers:{'Authorization':'Bearer '+token}}); }
      catch(e){_err('Gagal terhubung ke Stockbit.');_loadingTxt(false);return;}
      if(respD.status===401){_err('Token expired atau tidak valid.');_loadingTxt(false);return;}
      if(!respD.ok){_err('HTTP '+respD.status+' saat ambil data daily.');_loadingTxt(false);return;}
      var jsonD=await respD.json();
      var rawD=(jsonD.data&&jsonD.data.chartbit)||[];
      if(!rawD.length){_err('Tidak ada data daily untuk '+sym);_loadingTxt(false);return;}
      /* Normalisasi field daily → samakan dengan format intraday yang dipakai _process */
      var normD=rawD.map(function(c){
        return {
          datetime: c.date,
          unix_timestamp: c.unixdate,
          open: c.open, high: c.high, low: c.low, close: c.close,
          volume: c.volume, value: c.value,
          foreign_buy: c.foreignbuy, foreign_sell: c.foreignsell
        };
      });
      _process(normD);
      _status('● '+sym+' · '+STATE.candles.length+' bar · TF '+STATE.tf);
      _loadingTxt(false);
      return;
    }

    /* ══ Intraday (5m / 15m / 30m / 1H): endpoint /price/intraday (Unix timestamp) ══ */
    var mult=parseInt(STATE.tf);
    var now=Math.floor(Date.now()/1000);
    var startTs = (mult<=15) ? now-30*86400 : now-120*86400;

    var BATCH=180*86400;
    var allData=[], to=now, batchNum=0;
    var totalBatches=Math.ceil((now-startTs)/BATCH);
    var emptyStreak=0;

    while(to>startTs){
      var from=Math.max(to-BATCH, startTs);
      batchNum++;
      _loadingTxt(true,'Memuat '+sym+' ('+batchNum+'/'+totalBatches+') · '+allData.length+' bar...');
      var url='https://exodus.stockbit.com/chartbit/'+sym+'/price/intraday?from='+to+'&to='+from+'&limit=0&minutes_multiplier='+mult;
      var resp;
      try { resp=await fetch(url,{headers:{'Authorization':'Bearer '+token}}); }
      catch(e){ to=from; continue; }
      if(resp.status===401){_err('Token expired atau tidak valid.');_loadingTxt(false);return;}
      if(resp.status===400){
        if(batchNum===1){_err('Request ditolak (400). Saham "'+sym+'" mungkin tidak valid.');_loadingTxt(false);return;}
        emptyStreak++; if(emptyStreak>=3)break; to=from; continue;
      }
      if(!resp.ok){ if(batchNum===1){_err('HTTP '+resp.status);_loadingTxt(false);return;} to=from; continue; }
      var json=await resp.json();
      var arr=(json.data&&json.data.chartbit)||[];
      if(!arr.length){
        if(batchNum===1){_err('Tidak ada data untuk '+sym);_loadingTxt(false);return;}
        emptyStreak++; if(emptyStreak>=3)break;
      } else {
        emptyStreak=0;
        allData=allData.concat(arr);
      }
      break; /* intraday: 1 batch cukup untuk rentang yang dipakai */
    }

    if(!allData.length){_err('Tidak ada data untuk '+sym);_loadingTxt(false);return;}
    _process(allData);
    _status('● '+sym+' · '+STATE.candles.length+' bar · TF '+STATE.tf);
  }catch(e){_err('Error: '+e.message);}
  _loadingTxt(false);
}

function _process(arr){
  /* Dedup data mentah per unix_timestamp (batch bisa overlap) */
  var rawSeen={}, deduped=[];
  arr.forEach(function(c){
    var t=c.unix_timestamp;
    if(rawSeen[t])return; rawSeen[t]=1;
    deduped.push(c);
  });
  /* Sort ascending */
  var sorted=deduped.sort(function(a,b){return parseInt(a.unix_timestamp)-parseInt(b.unix_timestamp);});
  if(STATE.tf==='D')sorted=_aggDaily(sorted);
  else if(STATE.tf==='W')sorted=_aggWeekly(_aggDaily(sorted));
  var candles=[],volumes=[],seen={},rawArr=[];
  var isDW=(STATE.tf==='D'||STATE.tf==='W');
  sorted.forEach(function(c){
    /* Untuk D/W: time = string 'YYYY-MM-DD' (hindari pergeseran timezone).
       Untuk intraday: time = unix timestamp. */
    var t=isDW ? (c.datetime||'').slice(0,10) : parseInt(c.unix_timestamp);
    var key=String(t);
    if(seen[key])return;seen[key]=1;
    var o=+c.open,h=+c.high,l=+c.low,cl=+c.close,v=+c.volume;
    if(!o||!cl||!h||!l)return; /* skip candle invalid */
    if(h<l||cl<=0)return; /* skip data rusak */
    candles.push({time:t,open:o,high:h,low:l,close:cl});
    volumes.push({time:t,value:v,color:cl>=o?'rgba(38,166,154,0.4)':'rgba(242,54,69,0.4)'});
    rawArr.push({time:t,open:o,high:h,low:l,close:cl,volume:v,value:+(c.value||0),
      foreign_buy:+(c.foreign_buy||0),foreign_sell:+(c.foreign_sell||0)});
  });
  STATE.candles=candles;STATE.volumes=volumes;STATE.rawArr=rawArr;
  candleSeries.setData(candles);
  _recomputeIndicators();
  if(STATE.tf==='D'||STATE.tf==='W'){ try{ _ensureBrokerDaily(STATE.sym); }catch(e){} }
  try{ _applyEmitenDB(); }catch(e){}
  chart.timeScale().fitContent();
  if(candles.length){
    var last=candles[candles.length-1];
    document.getElementById('ch-name').textContent=STATE.name;
    document.getElementById('ch-meta').textContent='· '+(STATE.tf==='D'?'1D':STATE.tf==='W'?'1W':STATE.tf+'m')+' · IDX';
    _updateOHLC(last);
  }
}

function _aggDaily(rows){
  /* Data dari endpoint /price/daily sudah 1 candle per hari.
     Fungsi ini hanya dedup per-tanggal (jaga-jaga kalau ada input per-jam),
     dan TIDAK menghitung ulang timestamp — pakai unix_timestamp asli dari Stockbit. */
  var byDay={};
  rows.forEach(function(c){
    var day=(c.datetime||'').slice(0,10);
    if(!day)return;
    var ts=parseInt(c.unix_timestamp);
    if(!byDay[day]){
      byDay[day]={open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:+c.volume,
        value:+(c.value||0),foreign_buy:+(c.foreign_buy||0),foreign_sell:+(c.foreign_sell||0),
        _firstTs:ts,_lastTs:ts,
        unix_timestamp:ts,datetime:day};
    }else{
      var d=byDay[day];
      d.high=Math.max(d.high,+c.high);
      d.low=Math.min(d.low,+c.low);
      d.volume+=+c.volume;d.value+=+(c.value||0);
      d.foreign_buy+=+(c.foreign_buy||0);d.foreign_sell+=+(c.foreign_sell||0);
      if(ts<d._firstTs){d._firstTs=ts;d.open=+c.open;}
      if(ts>d._lastTs){d._lastTs=ts;d.close=+c.close;}
    }
  });
  return Object.values(byDay).sort(function(a,b){return a.unix_timestamp-b.unix_timestamp;});
}

function _aggWeekly(daily){
  /* Kelompokkan candle harian per minggu (Senin sebagai awal minggu) */
  var byWeek={};
  daily.forEach(function(c){
    var d=new Date(c.unix_timestamp*1000);
    var day=(d.getUTCDay()+6)%7; /* 0=Senin */
    var monday=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()-day));
    var key=monday.getUTCFullYear()+'-'+String(monday.getUTCMonth()+1).padStart(2,'0')+'-'+String(monday.getUTCDate()).padStart(2,'0');
    var ts=Math.floor(monday.getTime()/1000);
    if(!byWeek[key]){
      byWeek[key]={open:+c.open,high:+c.high,low:+c.low,close:+c.close,volume:+c.volume,
        value:+(c.value||0),foreign_buy:+(c.foreign_buy||0),foreign_sell:+(c.foreign_sell||0),
        _firstTs:c.unix_timestamp,_lastTs:c.unix_timestamp,
        unix_timestamp:ts,datetime:key};
    }else{
      var w=byWeek[key];
      w.high=Math.max(w.high,+c.high);
      w.low=Math.min(w.low,+c.low);
      w.volume+=+c.volume;w.value+=+(c.value||0);
      w.foreign_buy+=+(c.foreign_buy||0);w.foreign_sell+=+(c.foreign_sell||0);
      if(c.unix_timestamp<w._firstTs){w._firstTs=c.unix_timestamp;w.open=+c.open;}
      if(c.unix_timestamp>w._lastTs){w._lastTs=c.unix_timestamp;w.close=+c.close;}
    }
  });
  return Object.values(byWeek).sort(function(a,b){return a.unix_timestamp-b.unix_timestamp;});
}

function _updateOHLC(c){
  var prev=STATE.candles.length>1?STATE.candles[STATE.candles.length-2]:c;
  var col=c.close>=c.open?'#26a69a':'#f23645';
  var chg=c.close-(prev.close||c.open);
  var chgPct=prev.close?chg/prev.close*100:0;
  document.getElementById('ch-ohlc').innerHTML=
    '<span><span class="lbl">O</span><b style="color:'+col+'">'+(+c.open).toLocaleString('id-ID')+'</b></span>'+
    '<span><span class="lbl">H</span><b style="color:'+col+'">'+(+c.high).toLocaleString('id-ID')+'</b></span>'+
    '<span><span class="lbl">L</span><b style="color:'+col+'">'+(+c.low).toLocaleString('id-ID')+'</b></span>'+
    '<span><span class="lbl">C</span><b style="color:'+col+'">'+(+c.close).toLocaleString('id-ID')+'</b></span>'+
    '<span style="color:'+col+'">'+(chg>=0?'+':'')+chg.toFixed(2)+' ('+(chg>=0?'+':'')+chgPct.toFixed(2)+'%)</span>';
}

    ma:{period:20}, ema:{period:20}, wma:{period:20},
    bb:{period:20,mult:2}, vwap:{}, supertrend:{period:10,mult:3},
    psar:{step:0.02,max:0.2}, rsi:{period:14}, macd:{fast:12,slow:26,signal:9},
    stoch:{k:14,d:3}, atr:{period:14}, foreign:{}, broker:{code:'',metric:'val'}
  };
  return p[id]||{};
}

function _removeIndicator(uid){
  var ind=ACTIVE_IND[uid];
  if(!ind)return;
  ind.series.forEach(function(s){ try{ chart.removeSeries(s); }catch(e){} });
  delete ACTIVE_IND[uid];
  _layoutPanes();
  _renderActiveList();
}

/* Tata letak pane: bagi area bawah chart jadi band terpisah per indikator non-overlay,
   masing-masing punya skala (value) sendiri, tidak overlay dgn candle. */
function _layoutPanes(){
  if(!chart)return;
  /* kumpulkan uid pane non-overlay (punya priceScaleId sendiri = uid) */
  var paneUids=Object.keys(ACTIVE_IND).filter(function(uid){
    var ind=ACTIVE_IND[uid];
    return ind && !ind.overlay && !(ind.params&&ind.params.shape==='line');
  });
  var n=paneUids.length;
  /* Area candle di atas; pane dibagi rata di bawah. */
  var paneTotal = n===0 ? 0 : Math.min(0.62, 0.16*n + 0.04); /* total tinggi semua pane */
  var candleBottom = n===0 ? 0.06 : paneTotal + 0.04;
  try{ chart.priceScale('right').applyOptions({scaleMargins:{top:0.06,bottom:candleBottom}}); }catch(e){}
  if(n===0)return;
  var bandH=paneTotal/n;
  /* dari paling bawah ke atas: pane pertama paling bawah */
  paneUids.forEach(function(uid,i){
    var fromBottom = i*bandH;                 /* jarak dari dasar */
    var top = 1 - paneTotal + i*bandH + 0.01; /* margin atas band */
    var bottom = (n-1-i)*bandH + 0.02;        /* margin bawah band */
    try{ chart.priceScale(uid).applyOptions({scaleMargins:{top:top,bottom:bottom}}); }catch(e){}
  });
}

function _recomputeIndicators(){
  /* Rebuild semua indikator aktif dengan data baru */
  Object.keys(ACTIVE_IND).forEach(function(uid){
    var ind=ACTIVE_IND[uid];
    ind.series.forEach(function(s){ try{ chart.removeSeries(s); }catch(e){} });
    ind.series=[];
    _buildIndicator(uid);
  });
  _layoutPanes();
}

function _buildIndicator(uid){
  var ind=ACTIVE_IND[uid];
  if(!ind||!STATE.candles.length)return;
  var c=STATE.candles, p=ind.params;
  var closes=c.map(function(d){return d.close;});
  var col=IND_COLORS[Object.keys(ACTIVE_IND).indexOf(uid)%IND_COLORS.length];

  if(ind.id==='volume'){
    var hist=chart.addHistogramSeries({priceScaleId:uid,priceFormat:{type:'volume'},priceLineVisible:false,lastValueVisible:true,title:'Vol'});
    var data=[];
    for(var i=0;i<c.length;i++){ data.push({time:c[i].time,value:STATE.rawArr[i]?STATE.rawArr[i].volume:0,color:c[i].close>=c[i].open?'rgba(38,166,154,0.5)':'rgba(242,54,69,0.5)'}); }
    hist.setData(data);
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.8,bottom:0}});
    ind.series.push(hist);
  }
  else if(ind.id==='value'){
    var hist=chart.addHistogramSeries({priceScaleId:uid,priceFormat:{type:'volume'},priceLineVisible:false,lastValueVisible:true,title:'Value'});
    var data=[];
    for(var i=0;i<c.length;i++){
      var v=STATE.rawArr[i]?(STATE.rawArr[i].value||STATE.rawArr[i].volume*c[i].close):0;
      data.push({time:c[i].time,value:v,color:c[i].close>=c[i].open?'rgba(0,188,212,0.5)':'rgba(255,109,0,0.5)'});
    }
    hist.setData(data);
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.8,bottom:0}});
    ind.series.push(hist);
  }
  else if(ind.id==='ma'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'MA'+p.period});
    line.setData(_alignLine(c,_sma(closes,p.period)));
    ind.series.push(line);
  }
  else if(ind.id==='ema'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'EMA'+p.period});
    line.setData(_alignLine(c,_ema(closes,p.period)));
    ind.series.push(line);
  }
  else if(ind.id==='wma'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'WMA'+p.period});
    line.setData(_alignLine(c,_wma(closes,p.period)));
    ind.series.push(line);
  }
  else if(ind.id==='bb'){
    var bb=_bollinger(closes,p.period,p.mult);
    var mid=chart.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false,title:'BB'});
    var up=chart.addLineSeries({color:'rgba(41,98,255,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    var lo=chart.addLineSeries({color:'rgba(41,98,255,0.5)',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
    mid.setData(_alignLine(c,bb.mid));
    up.setData(_alignLine(c,bb.upper));
    lo.setData(_alignLine(c,bb.lower));
    ind.series.push(mid,up,lo);
  }
  else if(ind.id==='vwap'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'VWAP'});
    line.setData(_alignLine(c,_vwap(STATE.rawArr)));
    ind.series.push(line);
  }
  else if(ind.id==='supertrend'){
    var st=_supertrend(c,p.period,p.mult);
    var line=chart.addLineSeries({color:col,lineWidth:2,priceLineVisible:false,lastValueVisible:false,title:'Supertrend'});
    var data=[];
    for(var i=0;i<c.length;i++){ if(st[i]!=null) data.push({time:c[i].time,value:st[i].value,color:st[i].dir>0?'#26a69a':'#f23645'}); }
    line.setData(data);
    ind.series.push(line);
  }
  else if(ind.id==='psar'){
    var sar=_psar(c,p.step,p.max);
    var line=chart.addLineSeries({color:col,lineWidth:1,priceLineVisible:false,lastValueVisible:false,title:'PSAR',
      lineStyle:0,lineType:0});
    /* render sebagai titik via histogram-ish: pakai line dengan markers tidak ada, jadi pakai dots */
    line.applyOptions({pointMarkersVisible:true,lineVisible:false});
    line.setData(_alignLine(c,sar));
    ind.series.push(line);
  }
  else if(ind.id==='rsi'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:true,title:'RSI'});
    line.setData(_alignLine(c,_rsi(closes,p.period)));
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.7,bottom:0.05}});
    ind.series.push(line);
  }
  else if(ind.id==='macd'){
    var m=_macd(closes,p.fast,p.slow,p.signal);
    var macdLine=chart.addLineSeries({color:'#2962ff',lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:false,title:'MACD'});
    var sigLine=chart.addLineSeries({color:'#ff6d00',lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:false});
    var hist=chart.addHistogramSeries({priceScaleId:uid,priceLineVisible:false,lastValueVisible:false});
    macdLine.setData(_alignLine(c,m.macd));
    sigLine.setData(_alignLine(c,m.signal));
    var hd=[];for(var i=0;i<c.length;i++){if(m.hist[i]!=null)hd.push({time:c[i].time,value:m.hist[i],color:m.hist[i]>=0?'rgba(38,166,154,0.5)':'rgba(242,54,69,0.5)'});}
    hist.setData(hd);
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.72,bottom:0.05}});
    ind.series.push(macdLine,sigLine,hist);
  }
  else if(ind.id==='stoch'){
    var st=_stochastic(c,p.k,p.d);
    var kLine=chart.addLineSeries({color:'#2962ff',lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:false,title:'%K'});
    var dLine=chart.addLineSeries({color:'#ff6d00',lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:false,title:'%D'});
    kLine.setData(_alignLine(c,st.k));
    dLine.setData(_alignLine(c,st.d));
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.72,bottom:0.05}});
    ind.series.push(kLine,dLine);
  }
  else if(ind.id==='atr'){
    var line=chart.addLineSeries({color:col,lineWidth:2,priceScaleId:uid,priceLineVisible:false,lastValueVisible:true,title:'ATR'});
    line.setData(_alignLine(c,_atr(c,p.period)));
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.78,bottom:0.05}});
    ind.series.push(line);
  }
  else if(ind.id==='foreign'){
    var hist=chart.addHistogramSeries({priceScaleId:uid,priceLineVisible:false,lastValueVisible:true,title:'Foreign Net'});
    var data=[];
    STATE.rawArr.forEach(function(r){
      var net=r.foreign_buy-r.foreign_sell;
      data.push({time:r.time,value:net,color:net>=0?'rgba(38,166,154,0.6)':'rgba(242,54,69,0.6)'});
    });
    hist.setData(data);
    chart.priceScale(uid).applyOptions({scaleMargins:{top:0.75,bottom:0.05}});
    ind.series.push(hist);
  }
  else if(ind.id==='broker'){
    var cache=BROKER_CACHE[STATE.sym];
    var metric=p.metric==='lot'?'lot':'val';
    /* Kumpulkan buy & sell broker p.code per hari.
       sell.val SUDAH negatif; untuk "buy" pakai nilai positif, "sell" pakai nilai (negatif) apa adanya. */
    var buyArr=[], sellArr=[], netArr=[];
    if(p.code && cache && cache.daily && cache.daily.length){
      cache.daily.forEach(function(row){
        var bv=0, sv=0;
        (row.buys||[]).forEach(function(b){ if(b.code===p.code) bv+=(+b[metric]||0); });
        (row.sells||[]).forEach(function(s){ if(s.code===p.code) sv+=(+s[metric]||0); }); /* sv negatif */
        if(bv!==0) buyArr.push({time:row.date,value:bv});
        if(sv!==0) sellArr.push({time:row.date,value:sv});
        var net=bv+sv;
        if(net!==0) netArr.push({time:row.date,value:net});
      });
    }
    if(p.shape==='line'){
      /* Garis kumulatif net, overlay di chart utama (akumulasi/distribusi) */
      var line=chart.addLineSeries({priceScaleId:uid,lineWidth:2,color:'#2962ff',
        priceLineVisible:false,lastValueVisible:true,title:'Broker '+p.code+' (kum)'});
      var cum=0, ld=netArr.map(function(d){cum+=d.value;return{time:d.time,value:cum};});
      line.setData(ld);
      chart.priceScale(uid).applyOptions({scaleMargins:{top:0.1,bottom:0.7}});
      ind.series.push(line);
    } else if(p.net){
      /* net:true → 1 bar selisih (MACD-style): hijau di atas, merah di bawah */
      var hist=chart.addHistogramSeries({priceScaleId:uid,priceLineVisible:false,lastValueVisible:true,
        title:'Broker '+p.code+' net'});
      hist.setData(netArr.map(function(d){return{time:d.time,value:d.value,
        color:d.value>=0?'rgba(38,166,154,0.7)':'rgba(242,54,69,0.7)'};}));
      chart.priceScale(uid).applyOptions({scaleMargins:{top:0.75,bottom:0.05}});
      ind.series.push(hist);
    } else {
      /* net:false → dua bar: hijau buy ke atas + merah sell ke bawah */
      var hb=chart.addHistogramSeries({priceScaleId:uid,priceLineVisible:false,lastValueVisible:false,
        title:'Broker '+p.code+' buy'});
      hb.setData(buyArr.map(function(d){return{time:d.time,value:d.value,color:'rgba(38,166,154,0.7)'};}));
      var hs=chart.addHistogramSeries({priceScaleId:uid,priceLineVisible:false,lastValueVisible:false,
        title:'Broker '+p.code+' sell'});
      hs.setData(sellArr.map(function(d){return{time:d.time,value:d.value,color:'rgba(242,54,69,0.7)'};}));
      chart.priceScale(uid).applyOptions({scaleMargins:{top:0.6,bottom:0.05}});
      ind.series.push(hb); ind.series.push(hs);
    }
  }
}

/* Helper: align array nilai ke time candle, skip null */
function _alignLine(candles,vals){
  var out=[];
  for(var i=0;i<candles.length;i++){ if(vals[i]!=null&&!isNaN(vals[i])) out.push({time:candles[i].time,value:vals[i]}); }
  return out;
}

/* ── Kalkulasi indikator ── */
function _sma(arr,n){
  var out=new Array(arr.length).fill(null);
  for(var i=n-1;i<arr.length;i++){var s=0;for(var j=0;j<n;j++)s+=arr[i-j];out[i]=s/n;}
  return out;
}
function _ema(arr,n){
  var out=new Array(arr.length).fill(null);
  var k=2/(n+1),prev=null;
  for(var i=0;i<arr.length;i++){
    if(i<n-1)continue;
    if(prev===null){var s=0;for(var j=0;j<n;j++)s+=arr[i-j];prev=s/n;out[i]=prev;}
    else{prev=arr[i]*k+prev*(1-k);out[i]=prev;}
  }
  return out;
}
function _wma(arr,n){
  var out=new Array(arr.length).fill(null);
  var denom=n*(n+1)/2;
  for(var i=n-1;i<arr.length;i++){var s=0;for(var j=0;j<n;j++)s+=arr[i-j]*(n-j);out[i]=s/denom;}
  return out;
}
function _bollinger(arr,n,mult){
  var mid=_sma(arr,n),upper=new Array(arr.length).fill(null),lower=new Array(arr.length).fill(null);
  for(var i=n-1;i<arr.length;i++){
    var m=mid[i],s=0;for(var j=0;j<n;j++)s+=Math.pow(arr[i-j]-m,2);
    var sd=Math.sqrt(s/n);
    upper[i]=m+mult*sd;lower[i]=m-mult*sd;
  }
  return {mid:mid,upper:upper,lower:lower};
}
function _vwap(raw){
  var out=new Array(raw.length).fill(null),cumPV=0,cumV=0;
  for(var i=0;i<raw.length;i++){
    var tp=(raw[i].high+raw[i].low+raw[i].close)/3;
    cumPV+=tp*raw[i].volume;cumV+=raw[i].volume;
    out[i]=cumV?cumPV/cumV:null;
  }
  return out;
}
function _atr(c,n){
  var tr=new Array(c.length).fill(null),out=new Array(c.length).fill(null);
  for(var i=0;i<c.length;i++){
    if(i===0)tr[i]=c[i].high-c[i].low;
    else tr[i]=Math.max(c[i].high-c[i].low,Math.abs(c[i].high-c[i-1].close),Math.abs(c[i].low-c[i-1].close));
  }
  var sum=0;for(var i=0;i<n;i++)sum+=tr[i];out[n-1]=sum/n;
  for(var i=n;i<c.length;i++)out[i]=(out[i-1]*(n-1)+tr[i])/n;
  return out;
}
function _supertrend(c,n,mult){
  var atr=_atr(c,n),out=new Array(c.length).fill(null);
  var upperBand=[],lowerBand=[],dir=[];
  for(var i=0;i<c.length;i++){
    if(atr[i]==null){upperBand[i]=null;lowerBand[i]=null;continue;}
    var hl2=(c[i].high+c[i].low)/2;
    var bu=hl2+mult*atr[i], bl=hl2-mult*atr[i];
    if(i>0&&upperBand[i-1]!=null){
      bu=(bu<upperBand[i-1]||c[i-1].close>upperBand[i-1])?bu:upperBand[i-1];
      bl=(bl>lowerBand[i-1]||c[i-1].close<lowerBand[i-1])?bl:lowerBand[i-1];
    }
    upperBand[i]=bu;lowerBand[i]=bl;
    if(i===0||atr[i-1]==null){dir[i]=1;out[i]={value:bl,dir:1};}
    else{
      var pd=dir[i-1];
      if(pd>0){ if(c[i].close<lowerBand[i]){dir[i]=-1;out[i]={value:upperBand[i],dir:-1};}else{dir[i]=1;out[i]={value:lowerBand[i],dir:1};} }
      else{ if(c[i].close>upperBand[i]){dir[i]=1;out[i]={value:lowerBand[i],dir:1};}else{dir[i]=-1;out[i]={value:upperBand[i],dir:-1};} }
    }
  }
  return out;
}
function _psar(c,step,max){
  var out=new Array(c.length).fill(null);
  if(c.length<2)return out;
  var bull=true,af=step,ep=c[0].high,sar=c[0].low;
  for(var i=1;i<c.length;i++){
    sar=sar+af*(ep-sar);
    if(bull){
      if(c[i].low<sar){bull=false;sar=ep;ep=c[i].low;af=step;}
      else{if(c[i].high>ep){ep=c[i].high;af=Math.min(af+step,max);}}
    }else{
      if(c[i].high>sar){bull=true;sar=ep;ep=c[i].high;af=step;}
      else{if(c[i].low<ep){ep=c[i].low;af=Math.min(af+step,max);}}
    }
    out[i]=sar;
  }
  return out;
}
function _rsi(arr,n){
  var out=new Array(arr.length).fill(null);
  if(arr.length<=n)return out;
  var gain=0,loss=0;
  for(var i=1;i<=n;i++){var ch=arr[i]-arr[i-1];if(ch>=0)gain+=ch;else loss-=ch;}
  var ag=gain/n,al=loss/n;
  out[n]=al===0?100:100-100/(1+ag/al);
  for(var i=n+1;i<arr.length;i++){
    var ch=arr[i]-arr[i-1],g=ch>=0?ch:0,l=ch<0?-ch:0;
    ag=(ag*(n-1)+g)/n;al=(al*(n-1)+l)/n;
    out[i]=al===0?100:100-100/(1+ag/al);
  }
  return out;
}
function _macd(arr,fast,slow,sig){
  var ef=_ema(arr,fast),es=_ema(arr,slow);
  var macd=new Array(arr.length).fill(null);
  for(var i=0;i<arr.length;i++){if(ef[i]!=null&&es[i]!=null)macd[i]=ef[i]-es[i];}
  /* signal = EMA of macd (hanya yang non-null) */
  var macdVals=macd.map(function(v){return v==null?0:v;});
  var sigArr=_ema(macdVals,sig);
  var signal=new Array(arr.length).fill(null),hist=new Array(arr.length).fill(null);
  var firstMacd=macd.findIndex(function(v){return v!=null;});
  for(var i=0;i<arr.length;i++){
    if(i>=firstMacd+sig&&macd[i]!=null){signal[i]=sigArr[i];hist[i]=macd[i]-signal[i];}
  }
  return {macd:macd,signal:signal,hist:hist};
}
function _stochastic(c,kP,dP){
  var k=new Array(c.length).fill(null);
  for(var i=kP-1;i<c.length;i++){
    var hh=-Infinity,ll=Infinity;
    for(var j=0;j<kP;j++){hh=Math.max(hh,c[i-j].high);ll=Math.min(ll,c[i-j].low);}
    k[i]=hh===ll?50:(c[i].close-ll)/(hh-ll)*100;
  }
  var d=_sma(k.map(function(v){return v==null?0:v;}),dP);
  for(var i=0;i<c.length;i++){if(k[i]==null)d[i]=null;}
  return {k:k,d:d};
}

/* Daftar indikator aktif (chip) */
function _renderActiveList(){
  var el=document.getElementById('active-ind');
  if(!el)return;
  var keys=Object.keys(ACTIVE_IND);
  if(!keys.length){el.innerHTML='';return;}
  el.innerHTML=keys.map(function(uid){
    var ind=ACTIVE_IND[uid];
    var label=ind.name+(ind.params.period?' '+ind.params.period:'');
    return '<div class="active-ind-chip"><span>'+label+'</span>'+
      '<span class="aic-set" onclick="_openSettings(\''+uid+'\')">⚙</span>'+
      '<span class="aic-x" onclick="_removeIndicator(\''+uid+'\')">×</span></div>';
  }).join('');
}

/* ── Settings indikator ── */
var _setUID=null;
function _openSettings(uid){
  var ind=ACTIVE_IND[uid];
  if(!ind)return;
  _setUID=uid;
  document.getElementById('set-title').textContent=ind.name;
  var p=ind.params;
  var html='';
  if(ind.id==='broker'){
    html+='<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:var(--sub);margin-bottom:5px">Kode Broker</label>'+
      '<input type="text" id="set-code" value="'+(p.code||'')+'" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:5px;text-transform:uppercase;outline:none"></div>';
    html+='<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:var(--sub);margin-bottom:5px">Bentuk</label>'+
      '<select id="set-shape" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:5px;outline:none">'+
      '<option value="bar"'+(p.shape!=='line'?' selected':'')+'>Bar (pane, gaya MACD)</option>'+
      '<option value="line"'+(p.shape==='line'?' selected':'')+'>Garis kumulatif (overlay)</option></select></div>';
    html+='<div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:var(--sub);margin-bottom:5px">Ukuran</label>'+
      '<select id="set-metric" style="width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:8px 10px;border-radius:5px;outline:none">'+
      '<option value="val"'+(p.metric!=='lot'?' selected':'')+'>Net Value (Rp)</option>'+
      '<option value="lot"'+(p.metric==='lot'?' selected':'')+'>Net Lot</option></select></div>';
    html+='<div style="margin-bottom:14px;display:flex;align-items:center;gap:8px">'+
      '<input type="checkbox" id="set-net"'+(p.net?' checked':'')+' style="width:16px;height:16px">'+
      '<label for="set-net" style="font-size:12px;color:var(--text)">Net (1 bar selisih). Matikan = 2 bar buy &amp; sell terpisah.</label></div>';
    html+='<button onclick="_applyBrokerSettings()" style="width:100%;margin-top:8px;padding:10px;background:var(--blue);border:none;color:#fff;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer">Terapkan</button>';
    document.getElementById('set-body').innerHTML=html;
    document.getElementById('set-modal').classList.add('show');
    return;
  }

var DRAW={mode:'Cursor',pending:null,lines:[]};

function _setupDrawing(){
  var el=document.getElementById('chart');
  el.addEventListener('click',function(e){
    if(DRAW.mode==='Cursor')return;
    var rect=el.getBoundingClientRect();
    var x=e.clientX-rect.left, y=e.clientY-rect.top;
    var time=chart.timeScale().coordinateToTime(x);
    var price=candleSeries.coordinateToPrice(y);
    if(time==null||price==null)return;

    if(DRAW.mode==='Horizontal Line'){
      var ln=candleSeries.createPriceLine({price:price,color:'#2962ff',lineWidth:1,lineStyle:0,
        axisLabelVisible:true,title:price.toFixed(0)});
      DRAW.lines.push({type:'h',line:ln});
    }
    else if(DRAW.mode==='Trend Line'){
      if(!DRAW.pending){
        DRAW.pending={time1:time,price1:price};
      }else{
        var ls=chart.addLineSeries({color:'#2962ff',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
        ls.setData([
          {time:Math.min(DRAW.pending.time1,time),value:DRAW.pending.time1<time?DRAW.pending.price1:price},
          {time:Math.max(DRAW.pending.time1,time),value:DRAW.pending.time1<time?price:DRAW.pending.price1}
        ]);
        DRAW.lines.push({type:'t',series:ls});
        DRAW.pending=null;
      }
    }
  });
}

function _clearDrawings(){
  DRAW.lines.forEach(function(d){
    try{ if(d.type==='h')candleSeries.removePriceLine(d.line); else chart.removeSeries(d.series); }catch(e){}
  });
  DRAW.lines=[];
  DRAW.pending=null;
}

/* ═══════════════ BROKER ANALYSIS MODULE ═══════════════ */
/* Modular & portable — siap dipindah ke IHSG Lab sbg tab.
   Sumber: marketdetector_activity (bulanan, Top10) + broker_daily (harian, pane).
   CATATAN field Stockbit: buy pakai bval/blot/netbs_buy_avg_price (positif),
   sell pakai sval/slot/netbs_sell_avg_price (SUDAH negatif). */

function _fmtRp(v){
  var a=Math.abs(v);
  if(a>=1e12)return (v/1e12).toFixed(2)+'T';
  if(a>=1e9) return (v/1e9).toFixed(2)+'M';
  if(a>=1e6) return (v/1e6).toFixed(1)+'jt';
  if(a>=1e3) return (v/1e3).toFixed(0)+'rb';
  return String(Math.round(v));
}

/* Rentang Top broker (hari, dari data harian) & fetch harian (from/to tanggal) */
var BROKER_TOP_MONTHS=3;   /* legacy — tidak dipakai tapi dijaga agar tidak error */
var BROKER_TOP_DAYS=30;    /* default rentang Top10 (hari) dari data harian */

var BROKER_FETCH_TO='';

/* Agregat Top buyer/seller dari data HARIAN, dibatasi N hari terakhir.
   sell.val SUDAH negatif → tinggal ditambah. */
function _brokerTop(daily, days){
  if(!daily||!daily.length)return{buyers:[],sellers:[],dates:[],allCodes:[]};
  days=Math.max(1,days||30);
  /* ambil N hari terakhir dari data yang tersedia */
  var sorted=daily.slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var pick=sorted.slice(-days);
  var net={};
  pick.forEach(function(row){
    (row.buys||[]).forEach(function(b){ net[b.code]=(net[b.code]||0)+(+b.val||0); });
    (row.sells||[]).forEach(function(s){ net[s.code]=(net[s.code]||0)+(+s.val||0); });
  });
  var arr=Object.keys(net).map(function(k){return{code:k,net:net[k]};});
  var buyers =arr.filter(function(x){return x.net>0;}).sort(function(a,b){return b.net-a.net;}).slice(0,10);
  var sellers=arr.filter(function(x){return x.net<0;}).sort(function(a,b){return a.net-b.net;}).slice(0,10);
  var dates=pick.map(function(r){return r.date;});
  return{buyers:buyers,sellers:sellers,dates:dates,allCodes:Object.keys(net).sort()};
}

/* Agregat Top buyer/seller dari data BULANAN, dibatasi N bulan terakhir. */
function _brokerTop(monthly, nMonths){
  if(!monthly||!monthly.length)return{buyers:[],sellers:[],months:[],allCodes:[]};
  nMonths=Math.max(1,nMonths||3);
  var months=monthly.map(function(r){return r.month;}).sort();
  var pick=months.slice(-nMonths);
  var net={}; /* code -> net val. sell.val SUDAH negatif → tinggal ditambah. */
  monthly.forEach(function(r){
    if(pick.indexOf(r.month)<0)return;
    (r.buys||[]).forEach(function(b){ net[b.code]=(net[b.code]||0)+(+b.val||0); });
    (r.sells||[]).forEach(function(s){ net[s.code]=(net[s.code]||0)+(+s.val||0); });
  });
  var arr=Object.keys(net).map(function(k){return{code:k,net:net[k]};});
  var buyers =arr.filter(function(x){return x.net>0;}).sort(function(a,b){return b.net-a.net;}).slice(0,10);
  var sellers=arr.filter(function(x){return x.net<0;}).sort(function(a,b){return a.net-b.net;}).slice(0,10);
  return{buyers:buyers,sellers:sellers,months:pick,allCodes:Object.keys(net).sort()};
}

/* ── Background fetch: 1 saham per waktu, progress di bar atas ── */
var BG_FETCH=null; /* {sym, running} bila sedang berjalan */

function _bgBar(pct,label,show){
  var bar=document.getElementById('bgfetch-bar');

  var lab=document.getElementById('bgfetch-label');
  if(!bar)return;

/* Dipanggil dari tombol Fetch di panel broker */
function _fetchBrokerDaily(sym){
  var st=document.getElementById('bm-fetch-status');
  if(BG_FETCH&&BG_FETCH.running){
    if(st)st.textContent='Masih ada fetch berjalan ('+BG_FETCH.sym+'). Tunggu selesai dulu.';
    return;
  }
  var token=_getToken();
  if(!token){ if(st)st.textContent='Masukkan token dulu.'; return; }
  var selected=BROKER_CACHE[sym]&&BROKER_CACHE[sym].selected;
  if(!selected){ if(st)st.textContent='Pilih broker dulu (klik salah satu di atas).'; return; }
  var fromV=(document.getElementById('bm-from')||{}).value;
  var toV=(document.getElementById('bm-to')||{}).value;
  if(!fromV||!toV){ if(st)st.textContent='Isi tanggal from dan to dulu.'; return; }
  if(fromV>toV){ var tmp=fromV;fromV=toV;toV=tmp; }
  BROKER_FETCH_FROM=fromV; BROKER_FETCH_TO=toV;
  var dates=STATE.candles.map(function(c){return c.time;})
    .filter(function(t){return typeof t==='string' && t>=fromV && t<=toV;});
  if(!dates.length){ if(st)st.textContent='Tidak ada hari bursa di rentang itu (atau bukan timeframe Daily/Weekly).'; return; }
  if(st)st.textContent='Fetch '+sym+' berjalan di latar belakang. Kamu bisa menganalisa saham lain. Lihat progress di bar atas.';
  /* jalankan async tanpa menahan UI */
  _runBgFetch(sym, selected, dates, token);
}

async function _runBgFetch(sym, selected, dates, token){
  BG_FETCH={sym:sym, running:true};
  var existing={};
  (BROKER_CACHE[sym]&&BROKER_CACHE[sym].daily||[]).forEach(function(r){existing[r.date]=1;});
  var rows=(BROKER_CACHE[sym]&&BROKER_CACHE[sym].daily||[]).slice();
  var newRows=[], done=0, total=dates.length;
  for(var i=0;i<dates.length;i++){
    var dt=dates[i];
    _bgBar(Math.round((i/total)*100), 'Fetch '+sym+' · '+dt+' · '+(i+1)+'/'+total+' hari', true);
    if(existing[dt])continue;
    try{
      var url='https://exodus.stockbit.com/marketdetectors/'+sym+
        '?transaction_type=TRANSACTION_TYPE_NET&market_board=MARKET_BOARD_REGULER&investor_type=INVESTOR_TYPE_ALL&limit=25&from='+dt+'&to='+dt;
      var r=await fetch(url,{headers:{'Authorization':'Bearer '+token}});
      if(r.status===401){ _bgBar(0,'Token expired — fetch '+sym+' dihentikan',true); break; }
      if(r.status===429){ await new Promise(function(x){setTimeout(x,5000);}); i--; continue; }
      if(!r.ok){ continue; }
      var j=await r.json();
      var bs=(j.data&&j.data.broker_summary)||{};
      var buys=(bs.brokers_buy||[]).map(function(b){return{
        code:b.netbs_broker_code, type:b.type,
        val:parseFloat(b.bval||0), lot:parseFloat(b.blot||0),
        avg:parseFloat(b.netbs_buy_avg_price||0), freq:parseInt(b.freq||0)};});
      var sells=(bs.brokers_sell||[]).map(function(s){return{
        code:s.netbs_broker_code, type:s.type,
        val:parseFloat(s.sval||0), lot:parseFloat(s.slot||0),
        avg:parseFloat(s.netbs_sell_avg_price||0), freq:parseInt(s.freq||0)};});
      if(buys.length||sells.length){ newRows.push({date:dt,buys:buys,sells:sells,bandar:(j.data&&j.data.bandar_detector)||{}}); done++; }
    }catch(e){}
    await new Promise(function(x){setTimeout(x,250);});
  }
  rows=rows.concat(newRows).sort(function(a,b){return a.date<b.date?-1:1;});
  BROKER_CACHE[sym]=BROKER_CACHE[sym]||{};
  BROKER_CACHE[sym].daily=rows;
  /* simpan ke localStorage */
  try{ localStorage.setItem('bka_'+sym, JSON.stringify({rows:rows,ts:Date.now()})); }catch(e){}
  /* simpan ke database */
  if(newRows.length){
    _bgBar(98,'Menyimpan '+sym+' ('+done+' hari baru)...',true);
    try{
      await fetch(APPS_URL,{method:'POST',redirect:'follow',
        body:JSON.stringify({action:'bka_save_batch',sym:sym,rows:newRows})});
    }catch(e){}
  }
  _bgBar(100,'Selesai '+sym+' · '+done+' hari baru tersimpan',true);
  BG_FETCH.running=false;
  /* sembunyikan bar setelah 3 detik */
  setTimeout(function(){ if(!BG_FETCH||!BG_FETCH.running)_bgBar(0,'',false); },3000);
  /* kalau user masih di saham ini & panel broker terbuka, tampilkan pane */
  if(STATE.sym===sym){ _showBrokerPane(selected); }
}

/* Saat ganti emiten/timeframe, coba muat daily dari localStorage dulu, lalu Sheets */
function _ensureBrokerDaily(sym){
  var cache=BROKER_CACHE[sym]||{};
  if(cache.loadedDaily)return;
  cache.loadedDaily=true; BROKER_CACHE[sym]=cache;
  /* 1. Cek localStorage dulu */
  try{
    var lsKey='bka_'+sym;
    var ls=localStorage.getItem(lsKey);
    if(ls){
      var parsed=JSON.parse(ls);
      if(parsed&&parsed.rows&&parsed.rows.length){
        BROKER_CACHE[sym].daily=parsed.rows;
        _recomputeIndicators();
        return; /* cache hit — tidak perlu ke Sheets */
      }
    }
  }catch(e){}
  /* 2. Fallback ke Sheets */
  fetch(APPS_URL+'?action=bka_load&sym='+encodeURIComponent(sym))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d&&d.rows&&d.rows.length){
        BROKER_CACHE[sym].daily=d.rows;
        /* simpan ke localStorage */
        try{ localStorage.setItem('bka_'+sym, JSON.stringify({rows:d.rows,ts:Date.now()})); }catch(e){}
        _recomputeIndicators();
      }
    })
    .catch(function(){});
}

    if(_getToken())_load();
    else{_status('Masukkan token untuk memuat chart.');_err('Masukkan Bearer token di kanan atas, lalu klik ↻');}
  });
});
